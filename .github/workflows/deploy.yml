# ─────────────────────────────────────────────────────────────────
# SmartStore OS — CI/CD Pipeline
#
# Runs on every PR and push to main.
# Pipeline: install → lint → type-check → build → deploy
#
# Required GitHub Secrets (for deploy jobs):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID  (frontend)
#   RENDER_DEPLOY_HOOK                               (backend)
# ─────────────────────────────────────────────────────────────────

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ── Frontend CI ───────────────────────────────────────────────────

jobs:
  frontend-ci:
    name: Frontend — Lint, Type-check, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint
        # Fail the pipeline if any lint error is reported (warnings are ok)

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Build (production)
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:4000/graphql' }}

  # ── Backend CI ────────────────────────────────────────────────────

  backend-ci:
    name: Backend — Type-check, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Type-check (build tsconfig)
        run: npx tsc --project tsconfig.build.json --noEmit

      - name: Build
        run: npx tsc --project tsconfig.build.json
        env:
          DATABASE_URL: file:./prisma/dev.db

  # ── Deploy Frontend → Vercel ──────────────────────────────────────
  # Only runs on push to main (not on PRs)

  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set — skipping Vercel deploy."
            echo "Connect this repository in the Vercel dashboard for automatic deploys."
            exit 0
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  # ── Deploy Backend → Render ───────────────────────────────────────

  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: backend-ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK not set — Render auto-deploys if the service is linked to this repo."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy triggered."
