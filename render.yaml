## StoreOS — automatic deploy (SQLite on disk)
## Push to main → Render rebuilds if the GitHub repo is connected.
## Best DB option for this codebase: SQLite on /data (no separate Postgres).

services:
  - type: web
    name: storeos-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: node scripts/startProduction.cjs
    healthCheckPath: /health

    disk:
      name: storeos-sqlite
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Overridden again at boot by startProduction.cjs when /data exists
      - key: DATABASE_URL
        value: file:/data/prod.db
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://client-sigma-two-88.vercel.app
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 200
      - key: ENABLE_MONITORING
        value: true
