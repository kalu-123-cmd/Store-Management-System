## render.yaml — StoreOS Backend deployment on Render.com
## Free tier: SQLite on a persistent disk (500 MB)
## Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: storeos-api
    runtime: node
    region: oregon
    plan: free                          # upgrade to starter ($7/mo) for always-on
    rootDir: server
    buildCommand: >
      npm install &&
      npx prisma generate &&
      npm run build &&
      npx prisma db push --accept-data-loss
    startCommand: node dist/index.js
    healthCheckPath: /health

    # Persistent disk keeps the SQLite file between deploys
    disk:
      name: storeos-sqlite
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        value: file:/data/prod.db        # stored on the persistent disk
      - key: JWT_SECRET
        generateValue: true              # Render generates a random secret
      - key: CLIENT_URL
        sync: false                      # fill in your Vercel URL after deploy
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 200
      - key: ENABLE_MONITORING
        value: true
