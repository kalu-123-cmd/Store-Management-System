# ─────────────────────────────────────────────────────────────────
# StoreOS — Docker Compose (self-hosted)
# Runs: backend API + Nginx reverse proxy + static frontend
#
# Quick start:
#   cp .env.docker .env
#   docker compose up -d
#   docker compose exec api npx prisma db push
#   docker compose exec api node -e "require('./dist/prisma/seed')"
# ─────────────────────────────────────────────────────────────────

services:

  # ── Backend API ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: storeos_api
    restart: unless-stopped
    environment:
      NODE_ENV:     production
      PORT:         "4000"
      DATABASE_URL: file:/data/prod.db
      JWT_SECRET:   ${JWT_SECRET}
      CLIENT_URL:   ${CLIENT_URL:-http://localhost}
    volumes:
      - sqlite_data:/data         # SQLite persistent storage
      - uploads_data:/app/uploads # uploaded files
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:4000/health', r => { process.exit(r.statusCode===200?0:1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - storeos_net

  # ── Frontend static build served by Nginx ────────────────────────
  frontend:
    image: node:20-alpine
    container_name: storeos_frontend_build
    working_dir: /app
    volumes:
      - ./client:/app
      - frontend_dist:/app/dist
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost/graphql}
    command: >
      sh -c "npm ci && npm run build"
    profiles: [build]           # only runs when explicitly called:
                                # docker compose --profile build up frontend

  # ── Nginx reverse proxy ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: storeos_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro   # serve the Vite build
      - ./ssl:/etc/nginx/ssl:ro                  # optional TLS certs
    depends_on:
      api:
        condition: service_healthy
    networks:
      - storeos_net

volumes:
  sqlite_data:
  uploads_data:
  frontend_dist:

networks:
  storeos_net:
    driver: bridge
