version: '3.8'

services:
  # Database (PostgreSQL for production)
  postgres:
    image: postgres:15-alpine
    container_name: procurement_platform_db
    environment:
      POSTGRES_USER: procurement_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      POSTGRES_DB: procurement_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - procurement_network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: procurement_platform_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - procurement_network

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: procurement_platform_api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://procurement_user:${DB_PASSWORD:-secure_password_change_me}@postgres:5432/procurement_platform
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_change_me}
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
      - ./server/prisma:/app/server/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - procurement_network
    restart: unless-stopped

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: procurement_platform_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - procurement_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  procurement_network:
    driver: bridge
