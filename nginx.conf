# ─────────────────────────────────────────────────────────────────
# Nginx config — StoreOS reverse proxy
# HTTP  → redirects to HTTPS (when SSL certs are present)
# /graphql, /health, /upload, /download → proxied to Node API
# Everything else → served from the Vite build (SPA)
# ─────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # File upload limit (match server 10 MB)
    client_max_body_size 12M;

    # ── Upstream API ─────────────────────────────────────────────
    upstream storeos_api {
        server api:4000;
        keepalive 32;
    }

    # ── HTTP server ───────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Uncomment to redirect all HTTP to HTTPS once you have certs:
        # return 301 https://$host$request_uri;

        root /usr/share/nginx/html;
        index index.html;

        # ── API routes ───────────────────────────────────────────
        location ~ ^/(graphql|health|metrics|upload|download|documents|status) {
            proxy_pass         http://storeos_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── React SPA — all other routes ─────────────────────────
        location / {
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively
            location ~* \.(js|css|woff2|svg|ico|png|jpg|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }

    # ── HTTPS server (uncomment when you have SSL certs) ─────────
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     root /usr/share/nginx/html;
    #     index index.html;
    #
    #     location ~ ^/(graphql|health|metrics|upload|download|documents|status) {
    #         proxy_pass         http://storeos_api;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Real-IP         $remote_addr;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto $scheme;
    #         proxy_set_header   Connection        "";
    #     }
    #
    #     location / {
    #         try_files $uri $uri/ /index.html;
    #     }
    # }
}
